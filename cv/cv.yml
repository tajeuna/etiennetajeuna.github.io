research:
  - place: "Université du Québec en Outaouais, Gatineau, Quebec"
    date: "Since 2025"
    role: "LARIM research collaborations: Prof. Rokia Missaoui and Prof. Nadia Baaziz"
    area: "Research areas:"
    bullets_plain:
      - "Formal concept analysis."
      - "Logical rule extraction."
      - "Knowledge graph modeling for image recognition."
  - place: "Université de Sherbrooke, Quebec"
    date: "January 2024 - May 2024"
    role: "Research Assistant"
    supervisor: "Supervisor: Prof. Shengrui Wang"
    area: "Research area: building explainable models for identifying and predicting regimes in co-evolving time series."
    bullets:
      - { lead: "Modeling causal dependencies in co-evolving time series:", text: "given a set of synchronous time series, the goal of this work is to identify the influence relationships one series may have on another. By modeling the dependencies among the series at each time step, it becomes easier to predict their future values." }
  - place: "Université de Sherbrooke, Quebec"
    date: "January 2024 - May 2024"
    role: "Research Assistant"
    supervisor: "Supervisor: Prof. Djemel Ziou"
    area: "Research topic: time series sampling through reinforcement learning."
    bullets:
      - { lead: "Reinforcement learning-assisted sampling for time series clustering:", text: "defining a model that automatically selects a representative subset of time series for clustering through a penalty/reward process rather than random selection." }
  - place: "Université Laval, Quebec"
    date: "January 2021 - December 2023"
    role: "Postdoctoral Fellowship in Machine Learning"
    supervisor: "Supervisor: Prof. Pascal Germain · Co-supervisor: Prof. Jacques Corbeil"
    area: "Research area: deep learning based on graph structure representation."
    bullets:
      - { lead: "Graph structure representation for event prediction in georeferenced data:", text: "building a dynamic graph linking spatio-temporal activity to model the event context and predict event occurrences in space and time." }
      - { lead: "Survival analysis for risk modeling (deep learning approach):", text: "developing a nonlinear deep approach to uncover relationships between risk factors and optimize the prediction of event occurrence risk." }
      - { lead: "Predicting the degeneration of graph substructures in evolving graphs:", text: "a model capable of tracking the evolution of graph substructures and predicting their eventual disappearance." }

