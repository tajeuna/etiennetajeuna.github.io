{% assign pubs = site.data.publications | where: "type", include.type %}
<div class="pub-list">
{% for p in pubs %}
<div class="pub-item">
  <span class="pub-year">{{ p.year }}</span>
  <div class="pub-body">
    <div class="pub-title">{{ p.title }}</div>
    <div class="pub-meta">{{ p.authors | replace: "E. Tajeuna", "<strong>E. Tajeuna</strong>" }} &nbsp;·&nbsp; <span class="pub-venue">{{ p.venue }}</span>{% if p.doi %} &nbsp;·&nbsp; <a href="https://doi.org/{{ p.doi }}">DOI</a>{% elsif p.url %} &nbsp;·&nbsp; <a href="{{ p.url }}">{{ p.link_label | default: "Link" }}</a>{% endif %}</div>
  </div>
</div>
{% endfor %}
</div>
