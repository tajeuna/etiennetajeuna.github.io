<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% if page.title and page.title != "Home" %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}" />
  <link rel="preconnect" href="https://fonts.googleapis.com" /> 
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&family=DM+Mono:wght@400&display=swap" rel="stylesheet" />
  <style>
    /* ── RESET ──────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }

    /* ── DESIGN TOKENS ──────────────────────────────────── */
    :root {
      --bg:            #eef2f6;
      --bg2:           #e6ebf1;
      --surface:       #ffffff;
      --surface2:      #f6f8fb;
      --border:        #d8dee8;
      --border2:       #b9c4d4;
      --accent:        #2563eb;
      --accent2:       #1d4ed8;
      --accent-glow:   rgba(37,99,235,.18);
      --accent-dim:    rgba(37,99,235,.08);
      --text:          #1e293b;
      --heading:       #0f172a;
      --text-dim:      #475569;
      --text-muted:    #64748b;
      --blue:          #2563eb;
      --serif:         'Cormorant Garamond', Georgia, serif;
      --sans:          'DM Sans', system-ui, sans-serif;
      --mono:          'DM Mono', 'Courier New', monospace;
      --nav-h:         64px;
      --max-w:         1080px;
      --px:            clamp(1.25rem, 4vw, 3rem);
      --radius:        6px;
    }

    /* ── BASE ───────────────────────────────────────────── */
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      font-size: 16px;
      line-height: 1.75;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    main { flex: 1; }

    a { color: var(--accent2); text-decoration: none; transition: color .2s; }
    a:hover { color: #1e40af; }
    img { max-width: 100%; display: block; }

    /* ── NAVIGATION ─────────────────────────────────────── */
    .nav {
      position: fixed;
      inset: 0 0 auto;
      height: var(--nav-h);
      z-index: 200;
      display: flex;
      align-items: center;
      padding: 0 var(--px);
      background: rgba(238,242,246,.88);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
    }

    .nav-brand {
      font-family: var(--serif);
      font-size: 1.2rem;
      font-weight: 500;
      letter-spacing: .05em;
      color: var(--accent2);
      margin-right: auto;
      white-space: nowrap;
    }
    .nav-brand:hover { color: var(--accent2); }

    .nav-links {
      display: flex;
      gap: clamp(1rem,2.5vw,2rem);
      align-items: center;
    }
    .nav-links a {
      font-size: .75rem;
      font-weight: 400;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--text-muted);
      position: relative;
      padding-bottom: 2px;
    }
    .nav-links a::after {
      content: '';
      position: absolute;
      bottom: -1px; left: 0; right: 0;
      height: 1px;
      background: var(--accent);
      transform: scaleX(0);
      transition: transform .25s ease;
      transform-origin: left;
    }
    .nav-links a:hover { color: var(--text); }
    .nav-links a:hover::after { transform: scaleX(1); }

    /* ── PAGE SHELL ─────────────────────────────────────── */
    .page-wrap {
      padding-top: calc(var(--nav-h) + 4rem);
      padding-bottom: 7rem;
      padding-left: var(--px);
      padding-right: var(--px);
      max-width: var(--max-w);
      margin: 0 auto;
    }

    /* ── PAGE HEADER ────────────────────────────────────── */
    .page-hd {
      margin-bottom: 3.5rem;
      padding-bottom: 2rem;
      border-bottom: 1px solid var(--border);
      animation: fadeUp .6s ease both;
    }
    .page-hd .eyebrow {
      font-size: .72rem;
      letter-spacing: .15em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: .75rem;
      display: block;
    }
    .page-hd h1 {
      font-family: var(--serif);
      font-size: clamp(2.2rem,5vw,3.8rem);
      font-weight: 400;
      line-height: 1.08;
      color: var(--heading);
      letter-spacing: -.01em;
    }
    .page-hd .lead {
      margin-top: 1rem;
      font-size: .95rem;
      color: var(--text-dim);
      max-width: 54ch;
    }

    /* ── PROSE CONTENT ──────────────────────────────────── */
    .prose { animation: fadeUp .65s .1s ease both; }

    .prose h2 {
      font-family: var(--serif);
      font-size: 1.9rem;
      font-weight: 400;
      color: var(--heading);
      margin: 3rem 0 1.1rem;
      padding-bottom: .6rem;
      border-bottom: 1px solid var(--border);
      letter-spacing: -.01em;
    }
    .prose h2:first-child { margin-top: 0; }

    .prose h3 {
      font-family: var(--serif);
      font-size: 1.28rem;
      font-weight: 500;
      color: var(--accent2);
      margin: 2.2rem 0 .7rem;
      letter-spacing: .01em;
    }

    .prose p {
      color: var(--text);
      margin-bottom: 1.1rem;
      font-size: .97rem;
      line-height: 1.85;
    }

    .prose ul {
      list-style: none;
      margin-bottom: 1.4rem;
    }
    .prose ul li {
      padding: .3rem 0 .3rem 1.75rem;
      position: relative;
      color: var(--text-dim);
      font-size: .94rem;
      line-height: 1.7;
    }
    .prose ul li::before {
      content: '—';
      position: absolute;
      left: 0;
      color: var(--accent);
      font-weight: 300;
    }

    .prose ol {
      padding-left: 1.5rem;
      margin-bottom: 1.4rem;
    }
    .prose ol li {
      font-size: .94rem;
      color: var(--text-dim);
      padding: .2rem 0;
      line-height: 1.7;
    }

    .prose strong { color: var(--text); font-weight: 500; }
    .prose em { font-style: italic; color: var(--text-dim); }

    .prose a { border-bottom: 1px solid rgba(37,99,235,.35); }
    .prose a:hover { border-bottom-color: var(--accent2); }

    .prose code {
      font-family: var(--mono);
      font-size: .85em;
      background: var(--surface2);
      padding: .1em .45em;
      border-radius: 3px;
      color: var(--accent2);
    }

    /* ── RESEARCH CARDS ─────────────────────────────────── */
    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.25rem;
      margin: 1.5rem 0 2.5rem;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.75rem;
      position: relative;
      overflow: hidden;
      transition: border-color .25s, transform .25s, box-shadow .25s;
    }
    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 2px;
      background: linear-gradient(90deg, var(--accent), transparent);
      opacity: 0;
      transition: opacity .3s;
    }
    .card:hover {
      border-color: var(--border2);
      transform: translateY(-3px);
      box-shadow: 0 12px 40px rgba(15,23,42,.10);
    }
    .card:hover::before { opacity: 1; }

    .card-icon {
      width: 36px;
      height: 36px;
      background: var(--accent-dim);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 1.1rem;
      font-size: 1rem;
    }
    .card h3 {
      font-family: var(--serif);
      font-size: 1.2rem;
      font-weight: 500;
      color: var(--heading);
      margin-bottom: .6rem;
      letter-spacing: .01em;
    }
    .card p {
      font-size: .87rem;
      color: var(--text-muted);
      line-height: 1.65;
    }

    /* ── PUBLICATION LIST ───────────────────────────────── */
    .pub-list { margin: 1rem 0 2.5rem; }

    .pub-item {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: .75rem 1.25rem;
      padding: 1.5rem 0;
      border-bottom: 1px solid var(--border);
      align-items: start;
      transition: background .2s;
    }
    .pub-item:first-child { border-top: 1px solid var(--border); }

    .pub-year {
      font-family: var(--mono);
      font-size: .78rem;
      color: var(--accent);
      padding-top: .18rem;
      white-space: nowrap;
      letter-spacing: .04em;
    }

    .pub-body {}
    .pub-title {
      font-family: var(--serif);
      font-size: 1.1rem;
      font-weight: 500;
      color: var(--text);
      line-height: 1.35;
      margin-bottom: .35rem;
    }
    .pub-meta {
      font-size: .83rem;
      color: var(--text-muted);
    }
    .pub-venue {
      font-style: italic;
      color: var(--text-dim);
    }
    .pub-tags {
      display: flex;
      flex-wrap: wrap;
      gap: .4rem;
      margin-top: .6rem;
    }
    .pub-tag {
      font-size: .7rem;
      letter-spacing: .06em;
      text-transform: uppercase;
      padding: .18em .65em;
      background: var(--accent-dim);
      border: 1px solid rgba(37,99,235,.2);
      border-radius: 2px;
      color: var(--accent);
    }

    /* ── BADGE PILLS ────────────────────────────────────── */
    .pill-row {
      display: flex;
      flex-wrap: wrap;
      gap: .5rem;
      margin: 1rem 0 1.5rem;
    }
    .pill {
      font-size: .77rem;
      letter-spacing: .06em;
      text-transform: uppercase;
      padding: .3em 1em;
      background: var(--surface2);
      border: 1px solid var(--border2);
      border-radius: 100px;
      color: var(--text-dim);
    }

    /* ── CONTACT ────────────────────────────────────────── */
    .contact-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 2.5rem;
      max-width: 560px;
    }
    .contact-card p { margin-bottom: .6rem; }
    .contact-card .label {
      font-size: .72rem;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: .25rem;
      display: block;
    }
    .contact-card .value {
      font-size: 1rem;
      color: var(--text);
      margin-bottom: 1.5rem;
    }

    /* ── INFO BOXES ─────────────────────────────────────── */
    .info-box {
      background: var(--accent-dim);
      border: 1px solid rgba(37,99,235,.2);
      border-left: 3px solid var(--accent);
      border-radius: 0 var(--radius) var(--radius) 0;
      padding: 1.25rem 1.5rem;
      margin: 1.5rem 0;
    }
    .info-box p { font-size: .92rem; color: var(--text-dim); margin: 0; }
    .cv-actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }
    .btn-download {
      display: inline-flex;
      align-items: center;
      gap: .55em;
      padding: .65em 1.5em;
      background: var(--accent);
      color: #fff;
      font-size: .8rem;
      font-weight: 500;
      letter-spacing: .08em;
      text-transform: uppercase;
      border-radius: 3px;
      transition: background .2s, transform .15s, box-shadow .2s;
    }
    .btn-download:hover {
      background: var(--accent2);
      color: #fff;
      transform: translateY(-1px);
      box-shadow: 0 8px 24px var(--accent-glow);
    }

    /* ── FOOTER ─────────────────────────────────────────── */
    .footer {
      border-top: 1px solid var(--border);
      padding: 2.5rem var(--px);
    }
    .footer-inner {
      max-width: var(--max-w);
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
    }
    .footer p { font-size: .8rem; color: var(--text-muted); }
    .footer-links { display: flex; gap: 1.5rem; }
    .footer-links a {
      font-size: .8rem;
      letter-spacing: .05em;
      color: var(--text-muted);
    }
    .footer-links a:hover { color: var(--accent2); }

    /* ── NETWORK BACKGROUND ───────────────────────────── */
    .net-bg {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
      opacity: .55;
    }
    main, .footer { position: relative; z-index: 1; }

    /* ── ANIMATIONS ─────────────────────────────────────── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    /* ── RESPONSIVE ─────────────────────────────────────── */
    @media (max-width: 700px) {
      :root { --nav-h: 104px; }
      .nav { flex-wrap: wrap; align-content: center; row-gap: .5rem; }
      .nav-links { width: 100%; flex-wrap: wrap; gap: .4rem 1rem; }
      .nav-links a { font-size: .68rem; }
      .card-grid { grid-template-columns: 1fr; }
      .footer-inner { flex-direction: column; text-align: center; }
      .footer-links { justify-content: center; }
      .pub-item { grid-template-columns: 1fr; gap: .25rem; }
    }
  </style>
</head>
<body>
  <canvas id="net-bg" class="net-bg" aria-hidden="true"></canvas>

  <nav class="nav">
    <a href="{{ '/' | relative_url }}" class="nav-brand">Étienne Tajeuna</a>
    <div class="nav-links">
      <a href="{{ '/research/' | relative_url }}">Research</a>
      <a href="{{ '/publications/' | relative_url }}">Publications</a>
      <a href="{{ '/teaching/' | relative_url }}">Teaching</a>
      <a href="{{ '/students/' | relative_url }}">Students</a>
      <a href="{{ '/projects/' | relative_url }}">Funding</a>
      <a href="{{ '/cv/' | relative_url }}">CV</a>
      <a href="{{ '/contact/' | relative_url }}">Contact</a>
    </div>
  </nav>

  <main>
  {{ content }}
  </main>

  <footer class="footer">
    <div class="footer-inner">
      <p>© {% assign y = 'now' | date: "%Y" %}{{ y }} Étienne Tajeuna &nbsp;·&nbsp; Université du Québec en Outaouais</p>
      <div class="footer-links">
        {% for link in site.minima.social_links %}<a href="{{ link.url }}" target="_blank" rel="noopener">{{ link.title }}</a>
        {% endfor %}      </div>
    </div>
  </footer>
  <script>
  /* Animated network background: clustered communities (each one internally
     connected), bridged to each other so the whole graph is connected, with
     signals diffusing along the edges. */
  (function () {
    const canvas = document.getElementById('net-bg');
    if (!canvas || !canvas.getContext) return;
    const ctx = canvas.getContext('2d');
    const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const PALETTE = ['37,99,235', '14,165,233', '99,102,241', '6,182,212', '59,130,246', '129,140,248', '56,189,248'];
    const TAU = Math.PI * 2;
    let W, H, dpr, comms = [], nodes = [], edges = [], adj = [], pulses = [], raf, mouse = null, t = 0;

    const rand = (a, b) => a + Math.random() * (b - a);
    const dist2 = (a, b) => (a.x - b.x) ** 2 + (a.y - b.y) ** 2;

    function link(i, j, bridge) {
      if (i === j || adj[i].includes(j)) return;
      edges.push({ a: i, b: j, bridge });
      adj[i].push(j); adj[j].push(i);
    }

    /* Minimum spanning tree (Prim) over a list of points: guarantees connectivity. */
    function mst(pts, onEdge) {
      const inTree = [0], rest = pts.map((_, i) => i).slice(1);
      while (rest.length) {
        let best = Infinity, bi = 0, bj = 0;
        inTree.forEach(i => rest.forEach((j, r) => {
          const d = dist2(pts[i], pts[j]);
          if (d < best) { best = d; bi = i; bj = r; }
        }));
        onEdge(bi, rest[bj]);
        inTree.push(rest[bj]); rest.splice(bj, 1);
      }
    }

    function place() {
      comms.forEach(c => {
        c.x = c.hx + Math.sin(t * c.wx + c.px) * c.ax;
        c.y = c.hy + Math.cos(t * c.wy + c.py) * c.ay;
        c.rot = c.rot0 + t * c.spin;
      });
      nodes.forEach(n => {
        const c = comms[n.c], cos = Math.cos(c.rot), sin = Math.sin(c.rot);
        const wob = 6 * Math.sin(t * n.wf + n.ph);
        n.x = c.x + n.ox * cos - n.oy * sin + wob;
        n.y = c.y + n.ox * sin + n.oy * cos + wob * .6;
      });
    }

    function init() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      W = window.innerWidth; H = window.innerHeight;
      canvas.width = W * dpr; canvas.height = H * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      t = 0; pulses = [];

      const k = W < 700 ? 4 : Math.max(5, Math.min(8, Math.round(W * H / 200000)));
      const cols = Math.max(1, Math.round(Math.sqrt(k * W / H))), rows = Math.ceil(k / cols);
      const cellW = W / cols, cellH = H / rows, R = Math.min(cellW, cellH) * .34;
      comms = Array.from({ length: k }, (_, i) => ({
        hx: cellW * (i % cols + .5) + rand(-cellW, cellW) * .12,
        hy: cellH * (Math.floor(i / cols) + .5) + rand(-cellH, cellH) * .12,
        ax: rand(.04, .09) * W, ay: rand(.04, .09) * H,
        wx: rand(.0012, .0026), wy: rand(.0012, .0026), px: rand(0, TAU), py: rand(0, TAU),
        rot0: rand(0, TAU), spin: rand(-.0016, .0016),
        color: PALETTE[i % PALETTE.length], members: [],
      }));

      const total = Math.max(50, Math.min(160, Math.floor(W * H / 8500)));
      nodes = Array.from({ length: total }, (_, n) => {
        const c = n % k, a = rand(0, TAU), r = R * Math.sqrt(Math.random());
        comms[c].members.push(n);
        return { c, ox: Math.cos(a) * r, oy: Math.sin(a) * r, r: rand(1.3, 2.6),
                 wf: rand(.008, .02), ph: rand(0, TAU), deg: 0, x: 0, y: 0 };
      });
      edges = []; adj = nodes.map(() => []);

      /* Intra-community edges: spanning tree + a few nearest neighbours. */
      comms.forEach(c => {
        const pts = c.members.map(i => ({ x: nodes[i].ox, y: nodes[i].oy }));
        mst(pts, (a, b) => link(c.members[a], c.members[b], false));
        c.members.forEach((i, ia) => {
          const near = c.members
            .map((j, ib) => ({ j, d: dist2(pts[ia], pts[ib]) }))
            .filter(o => o.j !== i).sort((p, q) => p.d - q.d).slice(0, 2);
          near.forEach(o => { if (Math.random() < .6) link(i, o.j, false); });
        });
      });

      /* Inter-community bridges: spanning tree over communities + a few extras. */
      place();
      const closestPair = (A, B) => {
        let best = Infinity, pair = [A.members[0], B.members[0]];
        A.members.forEach(i => B.members.forEach(j => {
          const d = dist2(nodes[i], nodes[j]);
          if (d < best) { best = d; pair = [i, j]; }
        }));
        return pair;
      };
      mst(comms.map(c => ({ x: c.hx, y: c.hy })), (a, b) => {
        const [i, j] = closestPair(comms[a], comms[b]); link(i, j, true);
      });
      for (let e = 0; e < Math.ceil(k / 2); e++) {
        const a = Math.floor(Math.random() * k), b = Math.floor(Math.random() * k);
        if (a === b) continue;
        const A = comms[a].members, B = comms[b].members;
        link(A[Math.floor(Math.random() * A.length)], B[Math.floor(Math.random() * B.length)], true);
      }
      nodes.forEach((n, i) => n.deg = adj[i].length);
    }

    function spawn(i, hops) {
      const nb = adj[i];
      if (!nb.length) return;
      const j = nb[Math.floor(Math.random() * nb.length)];
      pulses.push({ a: i, b: j, t: 0, speed: rand(.012, .026), hops, color: comms[nodes[j].c].color });
    }

    function step() {
      t += 1;
      place();
      for (let i = pulses.length - 1; i >= 0; i--) {
        const p = pulses[i];
        p.t += p.speed;
        if (p.t >= 1) {
          pulses.splice(i, 1);
          if (p.hops > 0) spawn(p.b, p.hops - 1);
        }
      }
      if (pulses.length < 18 && Math.random() < .08) spawn(Math.floor(Math.random() * nodes.length), 6);
    }

    function draw() {
      ctx.clearRect(0, 0, W, H);

      edges.forEach(e => {
        const a = nodes[e.a], b = nodes[e.b];
        ctx.strokeStyle = e.bridge ? 'rgba(100,116,139,.16)' : `rgba(${comms[a.c].color},.24)`;
        ctx.lineWidth = e.bridge ? .6 : .8;
        ctx.setLineDash(e.bridge ? [3, 4] : []);
        ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
      });
      ctx.setLineDash([]);

      if (mouse) {
        nodes.forEach(n => {
          const d2 = dist2(n, mouse);
          if (d2 < 160 * 160) {
            ctx.strokeStyle = `rgba(37,99,235,${(1 - d2 / 25600) * .3})`;
            ctx.lineWidth = .6;
            ctx.beginPath(); ctx.moveTo(n.x, n.y); ctx.lineTo(mouse.x, mouse.y); ctx.stroke();
          }
        });
      }

      pulses.forEach(p => {
        const a = nodes[p.a], b = nodes[p.b];
        const x = a.x + (b.x - a.x) * p.t, y = a.y + (b.y - a.y) * p.t;
        const g = ctx.createRadialGradient(x, y, 0, x, y, 6);
        g.addColorStop(0, `rgba(${p.color},.75)`);
        g.addColorStop(1, `rgba(${p.color},0)`);
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.arc(x, y, 6, 0, TAU); ctx.fill();
      });

      nodes.forEach(n => {
        const r = n.r + Math.min(n.deg, 6) * .22 + .4 * Math.sin(t * .03 + n.ph); /* hubs look bigger, nodes breathe */
        ctx.fillStyle = `rgba(${comms[n.c].color},.5)`;
        ctx.beginPath(); ctx.arc(n.x, n.y, Math.max(r, .8), 0, TAU); ctx.fill();
      });
    }

    function loop() { step(); draw(); raf = requestAnimationFrame(loop); }

    let rt;
    window.addEventListener('resize', () => {
      clearTimeout(rt);
      rt = setTimeout(() => { cancelAnimationFrame(raf); init(); reduce ? draw() : loop(); }, 150);
    });
    window.addEventListener('pointermove', e => { mouse = { x: e.clientX, y: e.clientY }; });
    document.addEventListener('pointerleave', () => { mouse = null; });

    init();
    if (reduce) draw(); else loop();
  })();
  </script>
</body>
</html>
